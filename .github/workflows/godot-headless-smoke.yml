name: Godot Headless Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.7.2-stable
      GODOT_VERSION_DIR: 4.7.2.stable
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Godot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          curl -fsSL -o "$RUNNER_TEMP/godot/Godot.zip" \
            "https://github.com/godotengine/godot-builds/releases/download/$GODOT_VERSION/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot/Godot.zip" -d "$RUNNER_TEMP/godot"
          ln -sf "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}_linux.x86_64"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/godot/godot" --version

      - name: Import Godot project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path godot --editor --quit

      - name: Run Godot headless smoke test
        shell: bash
        run: |
          set -uo pipefail
          set +e
          timeout 120 godot --headless --debug --ignore-error-breaks --path godot --quit-after 120 > "$RUNNER_TEMP/godot-smoke.log" 2>&1
          STATUS=$?
          set -e
          cat "$RUNNER_TEMP/godot-smoke.log"
          echo "godot_smoke_exit=$STATUS"
          if grep -Eq "SCRIPT ERROR|Parse Error|ERROR: Failed to load script" "$RUNNER_TEMP/godot-smoke.log"; then
            echo "Godot smoke test found script errors"
            exit 1
          fi
          if [[ "$STATUS" -ne 0 ]]; then
            exit "$STATUS"
          fi

      - name: Upload smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-smoke-log
          path: ${{ runner.temp }}/godot-smoke.log
